# didatasarim.com — Cloudflare Pages'e doğrudan dağıtım
#
# Cloudflare panelindeki Git bağlantısı koptuğunda bile her main push'u
# siteyi yayınlar. Çalışması için GitHub repo ayarlarına iki secret gerekir:
#   Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   : Cloudflare → My Profile → API Tokens →
#                            "Edit Cloudflare Workers" şablonu (Pages yazma izni)
#   CLOUDFLARE_ACCOUNT_ID  : Cloudflare panelinin sağ sütunundaki Account ID
# İsteğe bağlı değişken (Variables sekmesi):
#   CLOUDFLARE_PAGES_PROJECT : Pages proje adı (varsayılan: dida-website)
#
# Secret'lar tanımlı değilse iş sessizce atlanır, kırmızı CI üretmez.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Secret kontrolü
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID tanımlı değil; dağıtım atlandı."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - name: Dağıtım klasörünü hazırla
        if: steps.creds.outputs.ok == 'true'
        run: |
          rm -rf dist && mkdir dist
          cp index.html dist/
          mkdir -p dist/videos
          find videos -maxdepth 1 -type f -name '*.mp4' -exec cp {} dist/videos/ \;
          # Cloudflare Pages dosya başına 25 MiB sınırı
          find dist -type f -size +25M -print -exec false {} + || { echo "::error::25 MB üstü dosya var"; exit 1; }
          ls -la dist dist/videos

      - name: Cloudflare Pages'e yükle
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dida-website' }} --branch=main --commit-dirty=true
